.backend-job:
  extends: .component-job
  variables:
    COMPONENT: backend
    # Adjust GOPATH to enable caching of downloaded modules
    GOPATH: "$CI_PROJECT_DIR/.cache/go"
    # The Go image to use
    GOLANG_IMAGE: golang:1.25.5
  before_script:
    - !reference [.docker-build-default, before_script]
    - cd backend
  cache:
    key: "golang"
    paths:
      - .cache/go
    when: "always"

backend:build:
  extends: .backend-job
  stage: build
  needs: []
  dependencies: []
  image: $GOLANG_IMAGE
  script:
    - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -a -installsuffix cgo -o bin/myproject-ctl ./cli/ctl
  artifacts:
    paths:
      - backend/bin

backend:test:
  extends: .backend-job
  stage: test
  needs: []
  dependencies: []
  image: $GOLANG_IMAGE
  services:
    - name: postgres:17.4-bookworm
      command: ["postgres", "-c", "max_locks_per_transaction=256"]
  variables:
    SKIP_FOR_RELEASE: "true"
    TZ: Europe/Berlin
    POSTGRES_DB: myproject-test
    POSTGRES_USER: root
    POSTGRES_PASSWORD: ""
    POSTGRES_HOST_AUTH_METHOD: trust
  script:
    - go mod download
    - go run ./cli/ctl test preparedb
    - go run gotest.tools/gotestsum --junitfile junit-backend.xml
    - go test -cover ./... -coverpkg=myvendor.mytld/myproject/backend/... -coverprofile=coverage.out
    - go run github.com/boumenot/gocover-cobertura < coverage.out > coverage.xml
  artifacts:
    paths:
      - backend/coverage.out
    reports:
      junit: backend/junit-*.xml
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage.xml
    when: always

backend:lint:
  extends: .backend-job
  stage: test
  needs: []
  dependencies: []
  image: registry.networkteam.com/networkteam/docker/golangci-lint:2.7.1
  variables:
    SKIP_FOR_RELEASE: "true"
  script:
    # Write the code coverage report to gl-code-quality-report.json
    # and print linting issues to stdout in the format: path/to/file:line description.
    - golangci-lint run --output.code-climate.path stdout --output.text.path '' --show-stats=false | tee gl-code-quality-report.json | jq -r '.[] | "\(.severity)\t\(.location.path):\(.location.lines.begin) \(.description)"'
    # Fail if any issue with severity "blocker" is found
    - test -z "$(jq -r '.[] | select(.severity == "blocker") | .description' gl-code-quality-report.json)"
  artifacts:
    reports:
      codequality: backend/gl-code-quality-report.json
    paths:
      - backend/gl-code-quality-report.json

backend:codegen-check:
  extends: .backend-job
  stage: test
  needs: []
  dependencies: []
  image: $GOLANG_IMAGE
  variables:
    SKIP_FOR_RELEASE: "true"
  script:
    - go generate ./...
    - |
      if ! git diff --exit-code; then
        echo "ERROR: Generated code is not up-to-date. Please run 'go generate ./...' and commit the changes."
        exit 1
      fi
      echo "SUCCESS: Generated code is up-to-date."

backend:semgrep-sast:
  extends: .backend-job
  stage: test
  needs: []
  dependencies: []
  variables:
    SKIP_FOR_RELEASE: "true"
    ANALYZER_TARGET_DIR: $CI_PROJECT_DIR/backend
    SAST_EXCLUDED_PATHS: test
    SEARCH_MAX_DEPTH: 20
    SAST_ANALYZER_IMAGE_TAG: 4
    SAST_ANALYZER_IMAGE: "$SECURE_ANALYZERS_PREFIX/semgrep:$SAST_ANALYZER_IMAGE_TAG$SAST_IMAGE_SUFFIX"
  image:
    name: "$SAST_ANALYZER_IMAGE"
  script:
    - "/analyzer run"
  allow_failure: true
  artifacts:
    access: developer
    reports:
      sast:
      - backend/gl-sast-report.json

# Build docker image for backend
backend:docker:
  extends:
    - .backend-job
    - .docker-build
  stage: docker-build
  needs:
    - backend:build
  dependencies:
    - backend:build
  variables:
    PROJECT_COMPONENT: backend

# Copy the latest docker image for component if no changes occurred
backend:copy-docker:
  extends: .component-dockercopy-job
  variables:
    COMPONENT: backend
